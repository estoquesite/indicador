<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal de Indicadores - Vale</title>
    <!-- Importa a biblioteca SheetJS para ler arquivos .xlsx direto no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        h1 { color: #1f4e79; font-size: 22px; }
        .filters { background: #fff; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #d1d8e0; }
        .filters select { padding: 8px; font-size: 14px; }
        .table-container { max-height: 500px; overflow-y: auto; background: #fff; border: 1px solid #d1d8e0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 15px; text-align: left; border-bottom: 1px solid #d1d8e0; font-size: 13px; }
        th { background-color: #f1f3f5; position: sticky; top: 0; }
        tfoot td { background-color: #e9ecef; font-weight: bold; color: #1f4e79; position: sticky; bottom: 0; }
    </style>
</head>
<body>

    <h1>Portal de Indicadores - Auditoria 5S</h1>
    
    <div class="filters">
        <label for="filtroMes">Filtrar por Mês / Competência:</label>
        <select id="filtroMes" onchange="filtrarDados()">
            <option value="todos">Todos os Meses (Base Completa)</option>
        </select>
    </div>

    <div class="table-container">
        <table id="tabelaExcel">
            <thead>
                <tr id="cabecalhoTabela"></tr>
            </thead>
            <tbody id="corpoTabela">
                <tr><td colspan="5" style="text-align:center;">Carregando dados reais do arquivo avaliação.xlsx...</td></tr>
            </tbody>
            <tfoot>
                <tr>
                    <td id="rodapeTotal" colspan="5">Total de Registros: 0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script>
        let dadosGlobais = [];

        // Carrega automaticamente o arquivo avaliação.xlsx do mesmo repositório do GitHub
        async function carregarPlanilha() {
            try {
                let resposta = await fetch('avaliação.xlsx');
                let dadosBinarios = await resposta.arrayBuffer();
                let workbook = XLSX.read(dadosBinarios, { type: 'array' });
                
                // Pega a primeira aba da planilha
                let primeiraAba = workbook.SheetNames[0];
                let worksheet = workbook.Sheets[primeiraAba];
                
                // Converte a planilha em JSON (linhas e colunas reais)
                dadosGlobais = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                popularFiltrosE Tabela(dadosGlobais);
            } catch (erro) {
                alert("Erro ao carregar o arquivo avaliação.xlsx. Verifique se ele está na mesma pasta no GitHub.");
                console.error(erro);
            }
        }

        function popularFiltrosETabela(dados) {
            let tbody = document.getElementById("corpoTabela");
            let thead = document.getElementById("cabecalhoTabela");
            tbody.innerHTML = "";
            thead.innerHTML = "";

            if (dados.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>A planilha está vazia.</td></tr>";
                return;
            }

            // Cria os cabeçalhos com base nas colunas reais do seu Excel
            let colunas = Object.keys(dados[0]);
            colunas.forEach(col => {
                let th = document.createElement("th");
                th.innerText = col;
                thead.appendChild(th);
            });

            // Preenche todas as linhas reais
            exibirLinhas(dados);
        }

        function exibirLinhas(dados) {
            let tbody = document.getElementById("corpoTabela");
            tbody.innerHTML = "";

            dados.forEach(linha => {
                let tr = document.createElement("tr");
                Object.values(linha).forEach(valor => {
                    let td = document.createElement("td");
                    td.innerText = valor;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            document.getElementById("rodapeTotal").innerText = "Total de Registros Exibidos: " + dados.length;
        }

        function filtrarDados() {
            // Lógica de filtro flexível para as colunas da sua base
            let mesFiltro = document.getElementById("filtroMes").value;
            if (mesFiltro === "todos") {
                exibirLinhas(dadosGlobais);
            } else {
                // Filtra iterando pelas colunas que contêm texto de data ou mês
                let filtrados = dadosGlobais.filter(linha => {
                    return Object.values(linha).some(val => 
                        String(val).toLowerCase().includes(mesFiltro.toLowerCase())
                    );
                });
                exibirLinhas(filtrados);
            }
        }

        // Executa a leitura assim que a página abre no GitHub Pages
        window.onload = carregarPlanilha;
    </script>
</body>
</html>
