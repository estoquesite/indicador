<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Painel Corporativo</title>
<!-- Ícone profissional de Capacete de Segurança Industrial -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛑️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#e6ecfb 0,#f4f6fb 320px);color:#0f172a;min-height:100vh;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#0b1220 0%,#1e3a8a 55%,#2563eb 100%);color:#fff;padding:36px 28px 40px;border-bottom:4px solid #f59e0b;box-shadow:0 6px 24px rgba(11,18,32,.35);text-align:center}
header h1{font-size:28px;font-weight:900;letter-spacing:-.5px}
header p{margin-top:6px;font-size:15px;opacity:.75;font-weight:500}
main{max-width:980px;margin:0 auto;padding:36px 20px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;text-decoration:none;color:inherit;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 12%,#fff) 0,#fff 140px);border:1px solid color-mix(in srgb,var(--ac) 25%,#fff);border-top:7px solid var(--ac);border-radius:22px;padding:44px 24px 36px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.08);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 36px rgba(15,23,42,.18)}
.icon{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;font-size:52px;background:color-mix(in srgb,var(--ac) 16%,#fff)}
.card h2{font-size:26px;font-weight:900;color:var(--ac);letter-spacing:-.5px}
.card p{font-size:14.5px;color:#475569;font-weight:600;line-height:1.5;max-width:320px}
.go{margin-top:8px;background:var(--ac);color:#fff;font-weight:800;font-size:14px;padding:11px 26px;border-radius:12px}
footer{text-align:center;color:#94a3b8;font-size:12px;font-weight:600;padding:10px 0 30px}
@media(max-width:700px){main{grid-template-columns:1fr;padding:24px 16px}header h1{font-size:22px}.card{padding:32px 20px 28px}}
</style>
</head>
<body>
<header>
  <h1>🏭 Painel Corporativo</h1>
  <p>Escolha o painel que deseja acessar</p>
</header>

<main id="menu"></main>
<footer>Selecione uma das opções acima</footer>

<script>
const PAINEIS=[
  {
    nome: 'Ferramentas',
    icone: '🛠️',
    cor: '#2563eb',
    link: 'ferramentas.html',
    info: 'Inventário geral, devoluções e atrasos, e calibração de equipamentos.'
  },
  {
    nome: 'EPIs',
    icone: '⛑️',
    cor: '#ea580c',
    link: 'epis.html',
    info: 'Estoque de equipamentos de proteção individual, devoluções e validades.'
  }
];

document.getElementById('menu').innerHTML = PAINEIS.map(p => `
  <a class="card" href="${p.link}" style="--ac:${p.cor}">
   <div class="icon">${p.icone}</div>
   <h2>${p.nome}</h2>
   <p>${p.info}</p>
   <span class="go">Abrir painel →</span>
  </a>`).join('');
</script>
</body>
</html>
