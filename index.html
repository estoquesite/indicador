<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicador de Postos - Auditoria</title>
    <!-- Tailwind CSS para estilização moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <div class="max-w-7xl mx-auto p-6">
        <!-- Cabeçalho -->
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Painel de Indicadores de Postos</h1>
            <p class="text-sm text-gray-600">Cruzamento de dados entre a listagem de postos e as avaliações de auditoria.</p>
        </header>

        <!-- Filtros -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-wrap gap-4 items-center">
            <div>
                <label for="filtroMes" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Filtrar por Mês:</label>
                <select id="filtroMes" class="border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Todos os Meses</option>
                    <!-- Os meses serão preenchidos via script ou manualmente -->
                </select>
            </div>

            <div>
                <label for="filtroStatus" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Status da Avaliação:</label>
                <select id="filtroStatus" class="border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Todos</option>
                    <option value="Avaliado no Mês">Avaliado dentro do mês</option>
                    <option value="Fora do Prazo / Pendente">Fora do mês / Pendente</option>
                </select>
            </div>

            <div class="ml-auto">
                <span id="contadorRegistros" class="text-sm text-gray-500 font-medium">Exibindo 0 registros</span>
            </div>
        </div>

        <!-- Tabela de Dados -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            <th class="p-4">Código do Posto</th>
                            <th class="p-4">Nome / Título do Posto</th>
                            <th class="p-4">Expansão</th>
                            <th class="p-4">Mês de Referência (Data - Coluna D)</th>
                            <th class="p-4">Status da Auditoria</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-gray-200 text-sm">
                        <!-- Os dados serão injetados aqui pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // EXEMPLO DE DADOS (Substitua ou conecte com a exportação da sua planilha do Google Drive)
        // Página 1: Todos os postos (Código, Título, Expansão)
        // Plan 1: Dados avaliados (Título, Auditoria, Data da Coluna D)
        
        const dadosPostos = [
            { codigo: "P001", titulo: "Posto Centro", expansao: "Expansão A" },
            { codigo: "P002", titulo: "Posto Norte", expansao: "Expansão B" },
            { codigo: "P003", titulo: "Posto Sul", expansao: "Expansão A" }
        ];

        const dadosAvaliacoes = [
            { titulo: "Posto Centro", auditoria: "Audit 01", dataColunaD: "2026-08-15" }, // Formato AAAA-MM-DD ou MM/AAAA
            { titulo: "Posto Sul", auditoria: "Audit 02", dataColunaD: "2026-07-10" }
        ];

        function processarIndicador() {
            const tbody = document.getElementById('tabelaCorpo');
            tbody.innerHTML = '';

            // Cruzamento de dados por Título
            const resultadoCombinado = dadosPostos.map(posto => {
                const avaliacao = dadosAvaliacoes.find(a => a.titulo === posto.titulo);
                
                let mesAvaliacao = "-";
                let status = "Fora do Prazo / Pendente";

                if (avaliacao) {
                    mesAvaliacao = avaliacao.dataColunaD; // Ajuste conforme o formato da sua coluna D
                    // Lógica simples para checar se foi avaliado no mês vigente ou correspondente
                    status = "Avaliado no Mês"; 
                }

                return {
                    ...posto,
                    mesAvaliacao,
                    status
                };
            });

            // Renderizar na tabela
            resultadoCombinado.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-medium text-gray-900">${item.codigo}</td>
                    <td class="p-4">${item.titulo}</td>
                    <td class="p-4 text-gray-600">${item.expansao}</td>
                    <td class="p-4 text-gray-600">${item.mesAvaliacao}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${item.status === 'Avaliado no Mês' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${item.status}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('contadorRegistros').innerText = `Exibindo ${resultadoCombinado.length} registros`;
        }

        // Executar ao carregar a página
        window.onload = processarIndicador;
    </script>
</body>
</html>
