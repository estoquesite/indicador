<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicador de Avaliação de Postos - Mensal</title>
    <!-- Tailwind CSS para um design limpo e corporativo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-emerald-50/40 font-sans text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- CAPA DO INDICADOR (TEMA VERDE) -->
    <header class="bg-gradient-to-r from-emerald-900 via-green-900 to-teal-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-10 flex flex-col md:flex-row justify-between items-center">
            <div>
                <span class="bg-emerald-600 text-emerald-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Painel Corporativo</span>
                <h1 class="text-3xl font-extrabold mt-2 tracking-tight">Indicador de Avaliação de Postos</h1>
                <p class="text-emerald-200 mt-1 text-sm">Acompanhamento mensal sincronizado com o Google Drive.</p>
            </div>
            <div class="mt-4 md:mt-0 bg-white/10 backdrop-blur-md border border-white/20 px-6 py-3 rounded-xl text-center">
                <span class="block text-xs text-emerald-200 uppercase font-medium">Postos no Mês</span>
                <span id="totalPostosBadge" class="text-2xl font-bold text-white">25</span>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-6 -mt-4 mb-16 flex-grow w-full">
        
        <!-- BARRA DE FILTROS PRINCIPAIS (ANO, MÊS, STATUS) -->
        <div class="bg-white rounded-xl shadow-md p-5 mb-6 border border-emerald-100 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-4 items-center">
                <div>
                    <label for="filtroAno" class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Ano:</label>
                    <select id="filtroAno" class="bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-medium focus:ring-2 focus:ring-emerald-600 focus:outline-none" onchange="renderizarTabela()">
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>

                <div>
                    <label for="filtroMes" class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Mês de Referência:</label>
                    <select id="filtroMes" class="bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-medium focus:ring-2 focus:ring-emerald-600 focus:outline-none" onchange="renderizarTabela()">
                        <option value="Janeiro">Janeiro</option>
                        <option value="Fevereiro">Fevereiro</option>
                        <option value="Março">Março</option>
                        <option value="Abril">Abril</option>
                        <option value="Maio">Maio</option>
                        <option value="Junho">Junho</option>
                        <option value="Julho">Julho</option>
                        <option value="Agosto">Agosto</option>
                        <option value="Setembro" selected>Setembro</option>
                        <option value="Outubro">Outubro</option>
                        <option value="Novembro">Novembro</option>
                        <option value="Dezembro">Dezembro</option>
                    </select>
                </div>

                <div>
                    <label for="filtroStatusGeral" class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Status:</label>
                    <select id="filtroStatusGeral" class="bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-medium focus:ring-2 focus:ring-emerald-600 focus:outline-none" onchange="renderizarTabela()">
                        <option value="">Todos</option>
                        <option value="Avaliado">Avaliados</option>
                        <option value="Pendente">Pendentes</option>
                    </select>
                </div>
            </div>

            <div class="text-right">
                <span id="contadorExibidos" class="text-xl font-bold text-slate-900">25</span>
                <span class="block text-[10px] text-slate-500 uppercase font-medium">Exibindo no Mês</span>
            </div>
        </div>

        <!-- TABELA DE INDICADORES COM FILTROS NA LINHA VERDE -->
        <div class="bg-white rounded-xl shadow-md border border-emerald-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <!-- LINHA PRINCIPAL DA CABEÇA VERDE -->
                        <tr class="bg-emerald-900 text-white text-xs font-bold uppercase tracking-wider">
                            <th class="p-4">Código do Posto</th>
                            <th class="p-4">Nome do Posto / Título</th>
                            <th class="p-4">Nº da Auditoria</th>
                            <th class="p-4">Mês de Referência</th>
                            <th class="p-4">Status</th>
                        </tr>
                        <!-- LINHA DE FILTROS DIRETO NA COLUNA VERDE -->
                        <tr class="bg-emerald-800 text-white text-xs">
                            <th class="p-2"><input type="text" id="filtroCod" placeholder="Filtrar código..." class="w-full bg-emerald-950/60 border border-emerald-700 rounded px-2 py-1 text-white text-xs placeholder-emerald-300 focus:outline-none" oninput="renderizarTabela()"></th>
                            <th class="p-2"><input type="text" id="filtroNome" placeholder="Filtrar nome..." class="w-full bg-emerald-950/60 border border-emerald-700 rounded px-2 py-1 text-white text-xs placeholder-emerald-300 focus:outline-none" oninput="renderizarTabela()"></th>
                            <th class="p-2"><input type="text" id="filtroAud" placeholder="Filtrar auditoria..." class="w-full bg-emerald-950/60 border border-emerald-700 rounded px-2 py-1 text-white text-xs placeholder-emerald-300 focus:outline-none" oninput="renderizarTabela()"></th>
                            <th class="p-2 text-emerald-200 font-semibold">-</th>
                            <th class="p-2">
                                <select id="filtroStatusColuna" class="w-full bg-emerald-950/60 border border-emerald-700 rounded px-2 py-1 text-white text-xs focus:outline-none" onchange="renderizarTabela()">
                                    <option value="" class="bg-emerald-900 text-white">Todos</option>
                                    <option value="Avaliado" class="bg-emerald-900 text-white">Avaliado</option>
                                    <option value="Pendente" class="bg-emerald-900 text-white">Pendente</option>
                                </select>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-slate-200 text-sm">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-400">Lendo dados do Google Drive...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- RODAPÉ COM A VERSÃO -->
    <footer class="w-full text-center py-4 text-slate-400 text-[10px] border-t border-slate-200 bg-white">
        Indicador de Postos &bull; Versão 16
    </footer>

    <!-- SCRIPT DE PROCESSAMENTO -->
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQUoRnkIRo0UhP2r1_IbUfJ2abD3UyvsFBGR8c8tUKYtsUQqQvyfdVC2tDRIymeEA/pub?gid=786393118&single=true&output=csv";

        const basePostos = [
            { codigo: "POST-971536", nome: "Área de Caldeiraria e suas Máquinas G2" },
            { codigo: "POST-970384", nome: "Área de Resíduos G2" },
            { codigo: "POST-696691", nome: "Baia de Gases Almoxarifado" },
            { codigo: "POST-629350", nome: "Container Elétrica" },
            { codigo: "POST-629405", nome: "Container Mecânica" },
            { codigo: "POST-000327", nome: "Ferramentaria" },
            { codigo: "POST-822607", nome: "G4" },
            { codigo: "POST-629235", nome: "Gerador CUMIS" },
            { codigo: "POST-718361", nome: "Gerador MS" },
            { codigo: "POST-718343", nome: "Gerador Toyama" },
            { codigo: "POST-630280", nome: "Içamento de Carga (Contêiner)" },
            { codigo: "POST-387083", nome: "Laboratório de elétrica e eletrônica" },
            { codigo: "POST-971718", nome: "Matéria-Prima G2" },
            { codigo: "POST-971666", nome: "Oficina de Manutenção G2" },
            { codigo: "POST-971742", nome: "Produtos Acabados G2" },
            { codigo: "POST-971746", nome: "Produtos Químicos G2" },
            { codigo: "POST-970883", nome: "Sala de Compressores G2" },
            { codigo: "POST-935635", nome: "Sala do Almoxarifado G2" },
            { codigo: "POST-642629", nome: "Sala dos Compressores G1" },
            { codigo: "POST-199278", nome: "Sala elétrica 1" },
            { codigo: "POST-387013", nome: "Sala elétrica 2" },
            { codigo: "POST-629274", nome: "SPCI" },
            { codigo: "POST-000475", nome: "Subestação 01" },
            { codigo: "POST-971454", nome: "Subestação 02" },
            { codigo: "POST-971617", nome: "Usinagem G2" }
        ];

        let dadosAuditoriaDetalhados = [];

        function normalizar(texto) {
            if (!texto) return "";
            return texto.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        async function carregarDadosDrive() {
            try {
                const response = await fetch(CSV_URL);
                const textoCsv = await response.text();
                const linhas = textoCsv.split('\n');
                
                dadosAuditoriaDetalhados = [];

                for (let i = 1; i < linhas.length; i++) {
                    const linha = linhas[i];
                    if (!linha.trim()) continue;
                    
                    const colunas = linha.split(',');
                    if (colunas.length > 3) {
                        const numAuditoria = colunas[0] ? colunas[0].replace(/"/g, '').trim() : "N/D";
                        const dataRegistro = colunas[3] ? colunas[3].replace(/"/g, '').trim() : "-";
                        
                        let mesDetectado = "";
                        let anoDetectado = "2026";

                        if (dataRegistro.includes("/")) {
                            const partes = dataRegistro.split('/');
                            if (partes.length >= 2) {
                                const mesNum = parseInt(partes[1], 10);
                                const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
                                if (mesNum >= 1 && mesNum <= 12) {
                                    mesDetectado = mesesNomes[mesNum - 1];
                                }
                                if (partes.length >= 3 && partes[2].length === 4) {
                                    anoDetectado = partes[2];
                                }
                            }
                        }

                        const linhaStr = colunas.join(' ');
                        dadosAuditoriaDetalhados.push({
                            numAuditoria: numAuditoria,
                            mesDetectado: mesDetectado,
                            anoDetectado: anoDetectado,
                            textoNormalizado: normalizar(linhaStr)
                        });
                    }
                }
                renderizarTabela();
            } catch (erro) {
                console.error("Erro ao ler CSV:", erro);
                document.getElementById('tabelaCorpo').innerHTML = `<tr><td colspan="5" class="p-8 text-center text-rose-500">Erro ao carregar dados do Drive.</td></tr>`;
            }
        }

        function renderizarTabela() {
            const anoSelecionado = document.getElementById('filtroAno').value;
            const mesSelecionado = document.getElementById('filtroMes').value;
            const statusGeral = document.getElementById('filtroStatusGeral').value;

            const fCod = normalizar(document.getElementById('filtroCod').value);
            const fNome = normalizar(document.getElementById('filtroNome').value);
            const fAud = normalizar(document.getElementById('filtroAud').value);
            const fStatusCol = document.getElementById('filtroStatusColuna').value;

            const tbody = document.getElementById('tabelaCorpo');
            tbody.innerHTML = '';

            let listaMes = [];

            // Avalia apenas os 25 postos para o MÊS e ANO selecionados
            basePostos.forEach(posto => {
                const codigoNorm = normalizar(posto.codigo);
                let nomeCurto = normalizar(posto.nome)
                    .replace("area de", "")
                    .replace("sala de", "")
                    .replace("sala dos", "")
                    .replace("gerador", "")
                    .replace("container", "")
                    .trim();

                const mesNorm = normalizar(mesSelecionado);

                const achou = dadosAuditoriaDetalhados.find(item => {
                    let t = item.textoNormalizado;
                    let temPosto = t.includes(codigoNorm) || (nomeCurto.length > 3 && t.includes(nomeCurto));
                    let temMes = t.includes(mesNorm) || item.mesDetectado.toLowerCase() === mesSelecionado.toLowerCase();
                    let temAno = item.anoDetectado === anoSelecionado;
                    return temPosto && temMes && temAno;
                });

                listaMes.push({
                    codigo: posto.codigo,
                    nome: posto.nome,
                    mes: mesSelecionado,
                    numAuditoria: achou ? `#${achou.numAuditoria}` : "-",
                    status: achou ? "Avaliado" : "Pendente"
                });
            });

            // Aplicar filtros da linha verde e do status geral
            let dadosFiltrados = listaMes.filter(item => {
                let mCod = normalizar(item.codigo).includes(fCod);
                let mNome = normalizar(item.nome).includes(fNome);
                let mAud = normalizar(item.numAuditoria).includes(fAud);
                let mStatCol = fStatusCol === "" || item.status === fStatusCol;
                let mStatGer = statusGeral === "" || item.status === statusGeral;

                return mCod && mNome && mAud && mStatCol && mStatGer;
            });

            if (dadosFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">Nenhum posto encontrado para este filtro.</td></tr>`;
                document.getElementById('contadorExibidos').innerText = 0;
                return;
            }

            dadosFiltrados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-emerald-50/50 transition-colors";
                
                const badgeStatus = item.status === "Avaliado" 
                    ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800"><i class="fa-solid fa-check mr-1.5"></i> Avaliado no Mês</span>`
                    : `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800"><i class="fa-solid fa-clock mr-1.5"></i> Pendente de Avaliação</span>`;

                const audBadge = item.numAuditoria !== "-" 
                    ? `<span class="font-bold text-emerald-800 bg-emerald-100 px-2.5 py-1 rounded-md text-xs">${item.numAuditoria}</span>`
                    : `<span class="text-slate-400">-</span>`;

                tr.innerHTML = `
                    <td class="p-4 font-semibold text-slate-900">${item.codigo}</td>
                    <td class="p-4 font-medium text-slate-700">${item.nome}</td>
                    <td class="p-4">${audBadge}</td>
                    <td class="p-4 font-medium text-emerald-900">${item.mes}</td>
                    <td class="p-4">${badgeStatus}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('contadorExibidos').innerText = dadosFiltrados.length;
            document.getElementById('totalPostosBadge').innerText = listaMes.length;
        }

        window.onload = carregarDadosDrive;
    </script>
</body>
</html>
