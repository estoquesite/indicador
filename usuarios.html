<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Ferramentaria e Calibração</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--tx:#0f172a;--mu:#64748b;--pri:#2563eb;--red:#dc2626;--amb:#d97706;--yel:#ca8a04;--grn:#059669}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#1e3a8a;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:1000px;margin:0 auto}
h1{font-size:16px;font-weight:800}
#upd{font-size:11px;opacity:.8}
.rf{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;min-width:44px;min-height:40px;font-size:16px}
.rf.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:1000px;margin:10px auto 0}
.seg button{background:rgba(255,255,255,.12);color:#dbeafe;border:0;border-radius:12px;min-height:44px;font-weight:700;font-size:13px;font-family:inherit}
.seg button.on{background:#fff;color:#1e3a8a}
main{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font-family:inherit;color:inherit}
.kpi b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.kpi span{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
.kpi.on{outline:2px solid var(--pri)}
details.f{background:var(--card);border:1px solid var(--line);border-radius:14px}
details.f summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.f summary::-webkit-details-marker{display:none}
.fg{display:grid;gap:8px;padding:0 14px 14px;grid-template-columns:1fr 1fr}
.fg .w{grid-column:1/-1}
input,select{width:100%;min-height:44px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;background:#f8fafc;color:var(--tx)}
.btn{min-height:44px;border:1px solid var(--line);background:#f1f5f9;border-radius:10px;font-weight:700;font-family:inherit;color:#475569;grid-column:1/-1}
.cards{display:grid;gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ch{width:100%;text-align:left;background:none;border:0;padding:12px 14px;font-family:inherit;color:inherit;display:block}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-weight:700;word-break:break-word}
.tot{background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:2px 10px;font-weight:800;font-size:15px;flex-shrink:0}
.bar{height:6px;background:#f1f5f9;border-radius:4px;margin:8px 0 6px}.bar i{display:block;height:100%;border-radius:4px;background:#60a5fa}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ch2{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#f1f5f9;color:#475569}
.r{background:#fef2f2;color:var(--red)}.a{background:#fffbeb;color:var(--amb)}.y{background:#fefce8;color:var(--yel)}.g{background:#ecfdf5;color:var(--grn)}
.sub{font-size:11px;color:var(--mu)}
.det{border-top:1px solid var(--line);background:#f8fafc;padding:8px 14px;display:grid;gap:6px;font-size:12px}
.it{border-left:3px solid #60a5fa;padding:4px 0 4px 10px}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.hide{display:none}
</style>
</head>
<body>
<header>
 <div class="top"><div><h1>🛠️ Ferramentaria</h1><div id="upd">Carregando…</div></div><button class="rf" id="rf" onclick="atualizar(true)" aria-label="Atualizar">↻</button></div>
 <div class="seg"><button id="b-dev" class="on" onclick="aba('dev')">Devoluções</button><button id="b-inv" onclick="aba('inv')">Calibração</button></div>
</header>
<main>
 <section id="s-dev" class="space-y">
  <div class="kpis" id="k-dev"></div>
  <details class="f"><summary><span>🔎 Filtros</span><span id="fd-n" class="sub"></span></summary>
   <div class="fg"><input class="w" id="d-q" type="search" placeholder="Buscar solicitante ou ferramenta" oninput="rd()">
    <select id="d-ap" class="w" onchange="rd()"></select><select id="d-ano" onchange="rd()"></select><select id="d-mes" onchange="rd()"></select>
    <button class="btn" onclick="limpar('d')">Limpar filtros</button></div></details>
  <div id="l-dev" class="cards" style="margin-top:12px"></div>
 </section>
 <section id="s-inv" class="hide">
  <div class="kpis" id="k-inv"></div>
  <details class="f"><summary><span>🔎 Filtros</span><span id="fi-n" class="sub"></span></summary>
   <div class="fg"><input class="w" id="i-q" type="search" placeholder="Buscar equipamento" oninput="ri()">
    <select id="i-ano" onchange="ri()"></select><select id="i-mes" onchange="ri()"></select>
    <button class="btn" onclick="limpar('i')">Limpar filtros</button></div></details>
  <div id="l-inv" class="cards" style="margin-top:12px"></div>
 </section>
</main>

<script>
// Planilhas publicadas como CSV
const URLS=["https://docs.google.com/spreadsheets/d/e/2PACX-1vTo35odWXfxeP9OhQZRJ36txn6dxH6Y_lOi0l7N0OZV0uOAY51YSVrNFLNHBzawBg/pub?output=csv","https://docs.google.com/spreadsheets/d/e/2PACX-1vR4zF860IfKYViF0uSuN_Hd3LT-1uX_5IQPgZLl5FGu7pMF8CI96hrIlVfQmtOlWw/pub?output=csv"];
const KC="ferramentaria_cache_v2";
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DEV=[],INV=[],HOJE=new Date(),aberto=new Set(),stF='todos',ultimo=0;

/* ---------- utilitários ---------- */
function csv(t){ // leitor de CSV completo (aceita aspas e quebras de linha dentro de campos)
  const r=[];let row=[],c='',q=false;
  const fim=()=>{row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]};
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;fim()}else c+=ch}
  fim();
  const h=(r.shift()||[]).map(x=>x.trim());
  return{h,rows:r.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))};
}
function pd(s){const p=(s||'').split(' ')[0].split('/');return p.length==3&&+p[2]?new Date(+p[2],+p[1]-1,+p[0]):null}
const dias=d=>Math.round((d-HOJE)/864e5);
const fmt=d=>d?d.toLocaleDateString('pt-BR'):'—';
const pick=(r,...k)=>{for(const x of k)if(r[x])return r[x];return ''};
const stat=d=>{if(!d)return'sd';const n=dias(d);return n<0?'v':n<=30?'a30':n<=90?'a90':'ok'};
const STL={v:['Vencido','r'],a30:['Vence em até 30 dias','a'],a90:['Vence em até 90 dias','y'],ok:['Em dia','g'],sd:['Sem data','']};

/* ---------- carga ---------- */
function processar(t1,t2){
  HOJE=new Date();HOJE.setHours(0,0,0,0);
  const A=csv(t1),B=csv(t2);
  const ehDev=p=>/solicitante|atraso/i.test(p.h.join(' '));
  const pDev=ehDev(A)?A:B, pInv=pDev===A?B:A;
  DEV=pDev.rows.map(r=>{
    const d=pd(pick(r,'Data Devolução')),ap=pick(r,'Apelido Principal Ferramenta','Apelido','Descrição Ferramenta');
    return{sol:pick(r,'Nome Usuário Solicitante','Solicitante','Usuário')||'Desconhecido',ap,desc:pick(r,'Descrição Ferramenta'),emp:pick(r,'Data Empréstimo'),d,prot:pick(r,'Protocolo'),
      atraso:d?-dias(d):(parseInt(pick(r,'Dias de Atraso'))||0),ano:d?d.getFullYear():'',mes:d?MES[d.getMonth()]:''};
  });
  INV=pInv.rows.filter(r=>{const s=pick(r,'Status').toLowerCase();return !s||s==='ativo'}).map(r=>{
    const d=pd(pick(r,'Data próxima manutenção','Data Próxima Manutenção','Vencimento'));
    return{ap:pick(r,'Apelido','Descrição Ferramenta','Equipamento').trim(),d,sit:pick(r,'Situação ferramenta')||'—',st:stat(d),ano:d?d.getFullYear():'',mes:d?MES[d.getMonth()]:''};
  }).filter(x=>x.ap);
  preencher();rd();ri();
}
function preencher(){
  const sel=(id,l,vals,ord)=>{const e=$(id),v=e.value;e.innerHTML=`<option value="">${l}</option>`+vals.map(x=>`<option>${esc(x)}</option>`).join('');if(vals.map(String).includes(v))e.value=v};
  const u=a=>[...new Set(a.filter(Boolean))];
  const meses=a=>u(a).sort((x,y)=>MES.indexOf(x)-MES.indexOf(y));
  sel('d-ap','Todas as ferramentas',u(DEV.map(x=>x.ap)).sort());
  sel('d-ano','Ano',u(DEV.map(x=>x.ano)).sort());sel('d-mes','Mês',meses(DEV.map(x=>x.mes)));
  sel('i-ano','Ano',u(INV.map(x=>x.ano)).sort());sel('i-mes','Mês',meses(INV.map(x=>x.mes)));
}
async function atualizar(manual){
  const b=$('rf');b.classList.add('spin');
  try{
    const [a,c]=await Promise.all(URLS.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()})));
    localStorage.setItem(KC,JSON.stringify({t:Date.now(),a,c}));ultimo=Date.now();
    processar(a,c);$('upd').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('upd').textContent=DEV.length||INV.length?'⚠️ Sem conexão — mostrando dados salvos':'⚠️ Sem conexão e sem dados salvos';
  }
  b.classList.remove('spin');
}
function aba(t){
  for(const x of['dev','inv']){$('s-'+x).classList.toggle('hide',x!==t);$('b-'+x).classList.toggle('on',x===t)}
  scrollTo(0,0);
}
function limpar(p){
  (p==='d'?['d-q','d-ap','d-ano','d-mes']:['i-q','i-ano','i-mes']).forEach(i=>$(i).value='');
  if(p==='i')stF='todos';p==='d'?rd():ri();
}
function tg(k){const x=decodeURIComponent(k);aberto.has(x)?aberto.delete(x):aberto.add(x);x[0]==='d'?rd():ri()}
const kk=k=>encodeURIComponent(k);

/* ---------- devoluções ---------- */
function rd(){
  const q=$('d-q').value.toLowerCase().trim(),ap=$('d-ap').value,an=$('d-ano').value,me=$('d-mes').value;
  $('fd-n').textContent=[q,ap,an,me].filter(Boolean).length?'filtros ativos':'';
  const f=DEV.filter(x=>(!ap||x.ap===ap)&&(!an||x.ano==an)&&(!me||x.mes===me)&&(!q||(x.sol+' '+x.ap+' '+x.desc).toLowerCase().includes(q)));
  const U={};
  f.forEach(x=>{ // agrupa itens idênticos do mesmo protocolo
    const u=U[x.sol]??={sol:x.sol,n:0,max:-1e9,meses:{},it:{}};
    u.n++;u.max=Math.max(u.max,x.atraso);if(x.mes)u.meses[x.mes]=(u.meses[x.mes]||0)+1;
    const k=x.prot+'|'+x.ap,i=u.it[k]??={...x,q:0};i.q++;
  });
  const L=Object.values(U).sort((a,b)=>b.n-a.n||a.sol.localeCompare(b.sol));
  const mx=L[0]?.n||1;
  $('k-dev').innerHTML=`<div class="kpi"><b>${f.length}</b><span>Itens pendentes</span></div><div class="kpi"><b>${L.length}</b><span>Usuários</span></div><div class="kpi"><b style="color:var(--red)">${f.length?Math.max(...f.map(x=>x.atraso)):0}</b><span>Maior atraso (dias)</span></div><div class="kpi"><b>${f.filter(x=>x.atraso>30).length}</b><span>Atraso &gt; 30 dias</span></div>`;
  $('l-dev').innerHTML=L.length?L.map(u=>{
    const k='d:'+u.sol,o=aberto.has(k);
    return`<div class="c" style="${o?'grid-column:1/-1':''}"><button class="ch" onclick="tg('${kk(k)}')"><div class="row"><div class="nm">${esc(u.sol)}</div><span class="tot">${u.n}</span></div>
     <div class="bar"><i style="width:${u.n/mx*100}%"></i></div>
     <div class="chips">${u.max>0?`<span class="ch2 r">Maior atraso ${u.max} dias</span>`:'<span class="ch2 g">No prazo</span>'}${Object.entries(u.meses).sort((a,b)=>MES.indexOf(a[0])-MES.indexOf(b[0])).map(([m,n])=>`<span class="ch2">${m.slice(0,3)} ${n}</span>`).join('')}<span class="ch2">${o?'▲ ocultar':'▼ detalhes'}</span></div></button>
     ${o?`<div class="det">${Object.values(u.it).sort((a,b)=>b.atraso-a.atraso).map(i=>`<div class="it"><b>${i.q>1?i.q+'× ':''}${esc(i.ap||i.desc)}</b><div class="sub">Protocolo ${esc(i.prot)} · retirou ${esc(i.emp.split(' ')[0])} · devolução prevista ${fmt(i.d)}</div><span class="ch2 ${i.atraso>0?'r':'g'}">${i.atraso>0?i.atraso+' dias de atraso':'No prazo'}</span></div>`).join('')}</div>`:''}</div>`;
  }).join(''):'<div class="empty">Nenhum débito encontrado.</div>';
}

/* ---------- calibração ---------- */
function ri(){
  const q=$('i-q').value.toLowerCase().trim(),an=$('i-ano').value,me=$('i-mes').value;
  const base=INV.filter(x=>(!an||x.ano==an)&&(!me||x.mes===me)&&(!q||x.ap.toLowerCase().includes(q)));
  $('fi-n').textContent=[q,an,me].filter(Boolean).length?'filtros ativos':'';
  const c=s=>base.filter(x=>x.st===s).length;
  const K=[['v','Vencidos','var(--red)'],['a30','Vencem em 30 dias','var(--amb)'],['a90','Vencem em 90 dias','var(--yel)'],['todos','Equipamentos','var(--tx)']];
  $('k-inv').innerHTML=K.map(([s,l,col])=>`<button class="kpi ${stF===s?'on':''}" onclick="stF=stF==='${s}'?'todos':'${s}';ri()"><b style="color:${col}">${s==='todos'?base.length:c(s)}</b><span>${l}</span></button>`).join('');
  const f=base.filter(x=>stF==='todos'||x.st===stF);
  const G={};
  f.forEach(x=>{const g=G[x.ap]??={ap:x.ap,n:0,v:0,a30:0,a90:0,min:null,d:{}};g.n++;if(x.st==='v'||x.st==='a30'||x.st==='a90')g[x.st]++;
    if(x.d&&(!g.min||x.d<g.min))g.min=x.d;const k=fmt(x.d)+'|'+x.sit,e=g.d[k]??={d:x.d,sit:x.sit,st:x.st,q:0};e.q++});
  const L=Object.values(G).sort((a,b)=>(a.min?+a.min:9e15)-(b.min?+b.min:9e15)||a.ap.localeCompare(b.ap));
  $('l-inv').innerHTML=L.length?L.map(g=>{
    const k='i:'+g.ap,o=aberto.has(k),[sl,sc]=STL[stat(g.min)];
    return`<div class="c" style="${o?'grid-column:1/-1':''}"><button class="ch" onclick="tg('${kk(k)}')"><div class="row"><div class="nm">${esc(g.ap)}</div><span class="tot">${g.n}</span></div>
     <div class="sub" style="margin-top:4px">Próximo vencimento: <b>${fmt(g.min)}</b> ${g.min?`(${dias(g.min)<0?'há '+-dias(g.min)+' dias':'em '+dias(g.min)+' dias'})`:''}</div>
     <div class="chips">${g.v?`<span class="ch2 r">${g.v} vencido${g.v>1?'s':''}</span>`:''}${g.a30?`<span class="ch2 a">${g.a30} em 30 dias</span>`:''}${g.a90?`<span class="ch2 y">${g.a90} em 90 dias</span>`:''}${!g.v&&!g.a30&&!g.a90?`<span class="ch2 ${sc}">${sl}</span>`:''}<span class="ch2">${o?'▲ ocultar':'▼ datas'}</span></div></button>
     ${o?`<div class="det">${Object.values(g.d).sort((a,b)=>(a.d||0)-(b.d||0)).map(e=>`<div class="it"><b>${e.q}× vencem em ${fmt(e.d)}</b> <span class="ch2 ${STL[e.st][1]}">${STL[e.st][0]}</span><div class="sub">Situação: ${esc(e.sit)}</div></div>`).join('')}</div>`:''}</div>`;
  }).join(''):'<div class="empty">Nenhum equipamento encontrado.</div>';
}

/* ---------- início ---------- */
try{const c=JSON.parse(localStorage.getItem(KC)||'null');if(c){processar(c.a,c.c);ultimo=c.t;$('upd').textContent='Dados salvos de '+new Date(c.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}}catch(e){}
atualizar();
setInterval(()=>atualizar(),5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-ultimo>2*60*1000)atualizar()});
</script>
</body>
</html>
