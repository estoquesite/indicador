<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Corporativo - Ferramentaria & Movimentação</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bd:#e3e8f0;--ac:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#dbe6fb 0,#f4f6fb 280px);color:#0f172a;font-size:15px;padding-bottom:30px}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1e40af,#2563eb 55%,#3b82f6);border-bottom:5px solid #00f0ff;color:#fff;padding:14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:900;text-shadow:0 0 10px rgba(0,240,255,.9)}
#upd{font-size:12px;opacity:.85;margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:12px;min-height:40px;padding:0 16px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.b:hover{background:rgba(255,255,255,.3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:16px 28px 0;background:#e6eaf3;padding:5px;border-radius:14px}
.seg button{background:transparent;color:#475569;border:0;border-radius:10px;min-height:46px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{color:#fff;background:var(--c)}
main{max-width:1800px;margin:0 auto;padding:18px 28px;display:grid;gap:18px}
section{display:grid;gap:18px}.hide{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--bd);border-left:8px solid var(--kc);border-radius:16px;padding:16px 20px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.kpi b{display:block;font-size:28px;font-weight:900;color:var(--kc)}
.kpi span{font-size:11.5px;font-weight:800;color:#475569;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.box{background:#fff;border:1px solid var(--bd);border-top:5px solid var(--ac);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.06);min-width:0}
.box h3{font-size:13px;text-transform:uppercase;color:var(--ac);padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--bd)}
.hb{display:grid;grid-template-columns:minmax(80px,40%) 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:12.5px;font-weight:600;cursor:pointer}
.hb:hover .l{color:#1e3a8a}
.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{height:14px;background:#eef1f6;border-radius:99px;overflow:hidden}.t i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.v{font-weight:800;text-align:right;min-width:30px}
.empty{text-align:center;color:#64748b;padding:30px;font-weight:600}
.f{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px}
input,select{width:100%;min-height:42px;padding:8px 12px;border:1px solid #d5dce8;border-radius:10px;font-size:14px;font-family:inherit}
.btn{min-height:42px;padding:0 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.c{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:16px;box-shadow:0 2px 10px rgba(15,23,42,.06);overflow:hidden}
.c.red{border-left-color:#dc2626;background:#fff7f7}
.ch{width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;font-family:inherit;color:inherit}
.row{display:flex;justify-content:space-between;gap:10px}
.nm{font-weight:800}.tot{background:#e8effd;color:var(--ac);border-radius:10px;padding:3px 10px;font-weight:900;height:fit-content}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#f1f5f9;color:#475569}
.r{background:#fee2e2;color:#991b1b}.a{background:#fef3c7;color:#92400e}.g{background:#d1fae5;color:#065f46}.bl{background:#dbeafe;color:#1e40af}
.det{display:none;border-top:1px solid #cbd5e1;background:#f7f9fc;padding:12px 16px;gap:6px;font-size:13px}.c.open .det{display:grid}
.it{border-left:3px solid var(--ac);padding:7px 10px;background:#fff;border-radius:0 8px 8px 0}
.sub{font-size:12px;color:#64748b;font-weight:600}
#drop{border:3px dashed #93b4f5;border-radius:18px;background:#fff;padding:60px 20px;text-align:center;font-weight:700;color:#334155}
#drop big{display:block;font-size:46px}
@media(max-width:1100px){.grid,.cards{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.grid,.cards,.kpis,.f{grid-template-columns:1fr}main{padding:14px}.seg{margin:12px 14px 0}h1{font-size:18px}}
@media print{header .btns,.seg,.f{display:none}.hide{display:none}.cards{grid-template-columns:repeat(3,1fr)}.c .det{display:grid}}
</style></head><body>
<header><div class="top">
 <div><h1>🛠️ Painel Corporativo — Ferramentaria & Movimentação</h1><div id="upd">Nenhum relatório carregado</div></div>
 <div class="btns">
  <button class="b" onclick="$('arq').click()">📊 Anexar Excel</button>
  <button class="b" onclick="salvar()">💾 Salvar</button>
  <button class="b" onclick="print()">🖨️</button>
  <input type="file" id="arq" accept=".xls,.xlsx,.csv" hidden onchange="ler(this.files[0])">
 </div></div></header>
<div class="seg" style="--c:#2563eb">
 <button id="b-ger" class="on" style="--c:#2563eb" onclick="aba('ger')">📦 Visão Geral</button>
 <button id="b-pen" style="--c:#ea580c" onclick="aba('pen')">🔄 Em Empréstimo</button>
 <button id="b-cal" style="--c:#059669" onclick="aba('cal')">⚡ Calibração</button>
</div>
<main>
 <div id="drop"><big>📊</big>Clique em <b>Anexar Excel</b> ou arraste o relatório de movimentação (.xls / .xlsx) aqui</div>
 <section id="s-ger" class="hide"><div class="kpis" id="k-ger"></div><div class="grid" id="g-ger"></div></section>
 <section id="s-pen" class="hide" style="--ac:#ea580c">
  <div class="kpis" id="k-pen"></div><div class="grid" id="g-pen"></div>
  <div class="f"><input id="p-q" type="search" placeholder="Buscar usuário, ferramenta ou protocolo" oninput="rp()"><select id="p-ges" onchange="rp()"></select><select id="p-cal" onchange="rp()"><option value="">Calibração: todas</option><option>SIM</option><option>NAO</option></select><button class="btn" onclick="$('p-q').value=$('p-ges').value=$('p-cal').value='';rp()">Limpar</button></div>
  <div class="cards" id="l-pen"></div></section>
 <section id="s-cal" class="hide" style="--ac:#059669">
  <div class="kpis" id="k-cal"></div><div class="grid" id="g-cal"></div>
  <div class="f"><input id="c-q" type="search" placeholder="Buscar ferramenta de calibração" oninput="rc()"><select id="c-st" onchange="rc()"><option value="">Status: todos</option><option>Emprestada</option><option>Disponível</option></select><span></span><button class="btn" onclick="$('c-q').value=$('c-st').value='';rc()">Limpar</button></div>
  <div class="cards" id="l-cal"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KC='ferramentaria_mov_v1',soma=a=>a.reduce((s,x)=>s+x,0);
let MOV=[],ITENS=[],HOJE=new Date(),NOME='',cur='ger';
const pd=s=>{const m=String(s||'').match(/(\d+)\/(\d+)\/(\d+)(?:\s+(\d+):(\d+))?/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)):null};
const fmt=d=>d?d.toLocaleDateString('pt-BR'):'—';
const dias=d=>d?Math.max(0,Math.floor((HOJE-d)/864e5)):0;
const kpi=(v,l,c)=>`<div class="kpi" style="--kc:${c}"><b>${v}</b><span>${l}</span></div>`;
const hb=(items,fn)=>items.length?items.map(i=>`<div class="hb" ${fn?`onclick="${fn}(${esc(JSON.stringify(JSON.stringify(i.l)))})"`:''}><div class="l" title="${esc(i.l)}">${esc(i.l)}</div><div class="t"><i style="width:${Math.max(i.v/Math.max(...items.map(x=>x.v),1)*100,3)}%;${i.c?'background:'+i.c:''}"></i></div><div class="v">${i.v}</div></div>`).join(''):'<div class="empty">Sem dados</div>';
const box=(t,b)=>`<div class="box"><h3>${t}</h3>${b}</div>`;
const rank=(arr,k,n=8)=>Object.entries(arr.reduce((o,x)=>(o[x[k]||'—']=(o[x[k]||'—']||0)+1,o),{})).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([l,v])=>({l,v}));

function aba(t){cur=t;['ger','pen','cal'].forEach(x=>{$('s-'+x).classList.toggle('hide',x!==t||!MOV.length);$('b-'+x).classList.toggle('on',x===t)});scrollTo(0,0)}

/* ---- leitura do Excel ---- */
async function ler(f){
 if(!f)return;
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
  const hi=rows.findIndex(r=>r.map(x=>String(x).trim()).includes('dataMovimentacao'));
  if(hi<0)throw new Error('Não achei a coluna "dataMovimentacao". Este é o relatório de movimentação?');
  const h=rows[hi].map(x=>String(x).trim());
  const data=rows.slice(hi+1).filter(r=>r.some(x=>String(x).trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,String(r[i]??'').trim()])));
  NOME=f.name;localStorage.setItem(KC,JSON.stringify({n:NOME,t:Date.now(),d:data}));
  carregar(data,'Arquivo: '+NOME+' · carregado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){alert('Erro ao ler o arquivo: '+e.message)}
 $('arq').value='';
}

function carregar(data,msg){
 HOJE=new Date();HOJE.setHours(0,0,0,0);
 MOV=data.map(r=>({dt:pd(r.dataMovimentacao),tipo:r.tipoMovimentacao,prot:r.protocolo,tool:r.apelidoFerramenta||'—',cat:r.tipoFerramenta,cod:r.codigoIndividualFerramenta||r.codigoPartNumber||'—',sap:r.codigoSapFerramenta,usr:r.nomeUsuario||'(sem nome)',ges:r.nomeGestor||'—',fer:r.nomeFerramenteiro,cal:(r.necessitaCalibracao||'').toUpperCase().startsWith('S')?'SIM':'NAO'}));
 /* agrupa por protocolo+ferramenta+código: empréstimo sem devolução = em aberto */
 const G={};
 MOV.forEach(m=>{const k=[m.prot,m.sap,m.cod].join('|');const g=G[k]??={...m,emp:null,dev:null};
  if(m.tipo.startsWith('Empr'))g.emp=m.dt;else if(m.tipo.startsWith('Devol'))g.dev=m.dt;else if(!g.res)g.res=m.dt;});
 ITENS=Object.values(G).map(g=>({...g,aberto:!!g.emp&&!g.dev,dias:g.emp&&!g.dev?dias(g.emp):0,durac:g.emp&&g.dev?Math.max(0,Math.round((g.dev-g.emp)/864e5)):null}));
 $('upd').textContent=msg;$('drop').classList.add('hide');
 const ds=MOV.map(m=>m.dt).filter(Boolean).sort((a,b)=>a-b);
 if(ds.length)$('upd').textContent+=' · período '+fmt(ds[0])+' a '+fmt(ds[ds.length-1]);
 const ges=[...new Set(ITENS.filter(i=>i.aberto).map(i=>i.ges))].sort();
 $('p-ges').innerHTML='<option value="">Todos os gestores</option>'+ges.map(g=>`<option>${esc(g)}</option>`).join('');
 rg();rp();rc();aba(cur);
}

/* ---- Visão geral ---- */
function rg(){
 const aberto=ITENS.filter(i=>i.aberto),dev=ITENS.filter(i=>i.dev);
 const tipos={};MOV.forEach(m=>tipos[m.tipo]=(tipos[m.tipo]||0)+1);
 const dia={};MOV.forEach(m=>{if(m.dt){const k=m.dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});dia[k]=(dia[k]||0)+1}});
 $('k-ger').innerHTML=kpi(MOV.length,'Movimentações no relatório','#2563eb')+kpi(ITENS.length,'Empréstimos / protocolos-item','#7c3aed')+kpi(aberto.length,'Ainda não devolvidos','#ea580c')+kpi(dev.length,'Devolvidos','#059669');
 $('g-ger').innerHTML=
  box('📋 Tipo de movimentação',hb(Object.entries(tipos).map(([l,v])=>({l,v})).sort((a,b)=>b[1]||b.v-a.v)))+
  box('🏆 Ferramentas mais movimentadas',hb(rank(ITENS,'tool')))+
  box('👤 Usuários com mais itens',hb(rank(ITENS,'usr')))+
  box('🧑‍💼 Itens por gestor',hb(rank(ITENS,'ges')))+
  box('📅 Movimentações por dia',hb(Object.entries(dia).map(([l,v])=>({l,v}))))+
  box('🧰 Por tipo de ferramenta',hb(rank(ITENS,'cat').map(x=>({...x,l:x.l.split(' - ')[0]+' - '+(x.l.split(' - ')[1]||'')}))));
}

/* ---- Em empréstimo ---- */
function card(g,open,extra,red){return `<div class="c ${red?'red':''} ${open?'open':''}"><button class="ch" onclick="this.parentNode.classList.toggle('open')"><div class="row"><div class="nm">${esc(g.t)}</div><span class="tot">${g.n} it.</span></div><div class="chips">${extra}</div></button><div class="det">${g.det}</div></div>`}
function rp(){
 const q=$('p-q').value.toLowerCase().trim(),ge=$('p-ges').value,ca=$('p-cal').value;
 const f=ITENS.filter(i=>i.aberto&&(!ge||i.ges===ge)&&(!ca||i.cal===ca)&&(!q||(i.usr+' '+i.tool+' '+i.prot+' '+i.cod).toLowerCase().includes(q)));
 const U={};f.forEach(i=>(U[i.usr]??=[]).push(i));
 const L=Object.entries(U).map(([u,a])=>({u,a,max:Math.max(...a.map(x=>x.dias))})).sort((x,y)=>y.max-x.max||y.a.length-x.a.length);
 const med=f.length?Math.round(soma(f.map(x=>x.dias))/f.length):0,mx=f.length?Math.max(...f.map(x=>x.dias)):0;
 const mais7=f.filter(x=>x.dias>7).length;
 $('k-pen').innerHTML=kpi(f.length,'Itens em empréstimo','#ea580c')+kpi(L.length,'Usuários com itens','#7c3aed')+kpi(mx+' dias','Maior tempo emprestado','#dc2626')+kpi(med+' dias','Tempo médio emprestado','#d97706');
 const fx=[['Até 1 dia',x=>x<=1],['2 a 7 dias',x=>x>=2&&x<=7],['8 a 15 dias',x=>x>=8&&x<=15],['16 a 30 dias',x=>x>=16&&x<=30],['Mais de 30 dias',x=>x>30]].map(([l,fn])=>({l,v:f.filter(i=>fn(i.dias)).length}));
 $('g-pen').innerHTML=box('⏱️ Itens por tempo emprestado',hb(fx))+box('🏆 Top usuários (maior tempo)',hb(L.slice(0,8).map(x=>({l:x.u,v:x.max})),'pickU'))+box('🧰 Ferramentas mais pendentes',hb(rank(f,'tool')));
 $('l-pen').innerHTML=L.length?L.map(({u,a,max})=>{
  const det=a.sort((x,y)=>y.dias-x.dias).map(i=>`<div class="it"><b>${esc(i.tool)}</b><div class="sub">Protocolo ${esc(i.prot)} · Código ${esc(i.cod)} · Retirado em ${fmt(i.emp)} · Gestor: ${esc(i.ges)}</div><span class="chip ${i.dias>7?'r':'a'}">${i.dias} dia(s) emprestado</span> ${i.cal==='SIM'?'<span class="chip bl">Calibração</span>':''}</div>`).join('');
  return card({t:u,n:a.length,det},0,`<span class="chip ${max>7?'r':'a'}">Maior tempo: ${max} dia(s)</span><span class="chip">▼ ver itens</span>`,max>7)}).join(''):'<div class="empty">Nenhum item pendente 🎉</div>';
}
function pickU(j){$('p-q').value=JSON.parse(j);rp()}

/* ---- Calibração ---- */
function rc(){
 const q=$('c-q').value.toLowerCase().trim(),st=$('c-st').value;
 const base=ITENS.filter(i=>i.cal==='SIM'&&(!q||(i.tool+' '+i.cod).toLowerCase().includes(q)));
 const T={};base.forEach(i=>{const k=i.tool+'|'+i.cod;const t=T[k]??={t:i.tool,cod:i.cod,h:[]};t.h.push(i)});
 let L=Object.values(T).map(t=>({...t,emp:t.h.some(x=>x.aberto),n:t.h.length})).filter(t=>!st||(st==='Emprestada')===t.emp).sort((a,b)=>b.emp-a.emp||b.n-a.n);
 $('k-cal').innerHTML=kpi(L.length,'Equipamentos de calibração','#059669')+kpi(L.filter(x=>x.emp).length,'Emprestados agora','#ea580c')+kpi(L.filter(x=>!x.emp).length,'Disponíveis','#2563eb')+kpi(soma(L.map(x=>x.n)),'Empréstimos no período','#7c3aed');
 $('g-cal').innerHTML=box('🔝 Mais emprestados',hb(L.slice().sort((a,b)=>b.n-a.n).slice(0,8).map(x=>({l:x.t+' ('+x.cod+')',v:x.n}))))+box('👤 Quem mais usa',hb(rank(base,'usr')))+box('🧑‍💼 Por gestor',hb(rank(base,'ges')));
 $('l-cal').innerHTML=L.length?L.map(t=>{
  const det=t.h.sort((a,b)=>(b.emp||0)-(a.emp||0)).map(i=>`<div class="it"><b>${esc(i.usr)}</b><div class="sub">Protocolo ${esc(i.prot)} · Retirado: ${fmt(i.emp)} · Devolvido: ${fmt(i.dev)}</div><span class="chip ${i.aberto?'r':'g'}">${i.aberto?'Em empréstimo há '+i.dias+' dia(s)':'Devolvido'}</span></div>`).join('');
  return card({t:t.t,n:t.n,det},0,`<span class="chip">Código: ${esc(t.cod)}</span><span class="chip ${t.emp?'r':'g'}">${t.emp?'Emprestada':'Disponível'}</span><span class="chip">▼ histórico</span>`,t.emp)}).join(''):'<div class="empty">Nenhum equipamento.</div>';
}

/* ---- Salvar: baixa Excel com os dados tratados ---- */
function salvar(){
 if(!MOV.length){alert('Anexe um relatório primeiro.');return}
 const wb=XLSX.utils.book_new(),L=a=>XLSX.utils.json_to_sheet(a);
 const pend=ITENS.filter(i=>i.aberto).map(i=>({Usuário:i.usr,Ferramenta:i.tool,Código:i.cod,Protocolo:i.prot,Retirada:fmt(i.emp),'Dias emprestado':i.dias,Gestor:i.ges,Calibração:i.cal}));
 const todos=ITENS.map(i=>({Protocolo:i.prot,Ferramenta:i.tool,Código:i.cod,Usuário:i.usr,Gestor:i.ges,Tipo:i.cat,Calibração:i.cal,Retirada:fmt(i.emp),Devolução:fmt(i.dev),Situação:i.aberto?'Em empréstimo':'Devolvido'}));
 XLSX.utils.book_append_sheet(wb,L(pend),'Em empréstimo');
 XLSX.utils.book_append_sheet(wb,L(todos),'Todos os itens');
 XLSX.utils.book_append_sheet(wb,L(MOV.map(m=>({Data:m.dt?m.dt.toLocaleString('pt-BR'):'',Tipo:m.tipo,Protocolo:m.prot,Ferramenta:m.tool,Código:m.cod,Usuário:m.usr,Gestor:m.ges}))),'Movimentações');
 XLSX.writeFile(wb,'painel_ferramentaria_'+new Date().toISOString().slice(0,10)+'.xlsx');
 $('upd').textContent+=' · 💾 salvo';
}

/* arrastar e soltar + dados salvos no navegador */
['dragover','drop'].forEach(e=>document.addEventListener(e,ev=>{ev.preventDefault();if(e==='drop')ler(ev.dataTransfer.files[0])}));
try{const c=JSON.parse(localStorage.getItem(KC)||'null');if(c)carregar(c.d,'Dados salvos: '+c.n+' ('+new Date(c.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+')')}catch(e){}
</script></body></html>
