<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Gestão de Materiais não Estocáveis</title>
<!-- Ícone profissional de Caixa para Estoque -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--line:#cbd5e1;--tx:#0f172a;--mu:#475569;--pri:#7c3aed;--bd:#e3e8f0;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06);--sh2:0 8px 28px rgba(15,23,42,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f4f6fb;color:var(--tx);font-size:14px;line-height:1.4;padding-bottom:30px;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased}

/* Cabeçalho */
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0b1220 0%,#1e1b4b 60%,#7c3aed 100%);color:#fff;padding:14px 28px;box-shadow:0 6px 24px rgba(11,18,32,.35);border-bottom:4px solid #f59e0b}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title-area{display:flex;align-items:center;gap:12px}
.home-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:12px;width:40px;height:40px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:all .2s}
.home-btn:hover{background:rgba(255,255,255,.3)}
h1{font-size:19px;font-weight:900;letter-spacing:-.3px}
#upd{font-size:12px;opacity:.75;margin-top:2px}
.top-btns{display:flex;gap:8px}
.rf,.print-btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;min-width:38px;min-height:38px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.rf:hover,.print-btn:hover{background:rgba(255,255,255,.2)}
.rf.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* Abas */
.seg{display:flex;gap:8px;margin:16px 28px 0;background:#ede9fe;padding:5px;border-radius:14px;overflow-x:auto}
.seg button{background:transparent;color:#6b21a8;border:0;border-radius:10px;padding:10px 20px;font-weight:800;font-size:13.5px;font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.6)}
.seg button.on{background:#fff;color:#7c3aed;box-shadow:0 2px 8px rgba(124,58,237,.18)}

main{max-width:1800px;margin:0 auto;padding:18px 28px;display:grid;gap:18px}
section{display:grid;gap:18px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:500px;margin-left:auto}
.kpi{position:relative;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 20px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center}
.kpi.alert{border-top:5px solid #be123c;background:linear-gradient(180deg,#fff1f2 0%,#fff 100%)}
.kpi.normal{border-top:5px solid #7c3aed;background:linear-gradient(180deg,#f3e8ff 0%,#fff 100%)}
.kpi div{display:flex;flex-direction:column}
.kpi b{font-size:24px;font-weight:900;color:#1e293b}
.kpi span{font-size:11px;font-weight:800;color:#6b7a90;text-transform:uppercase;letter-spacing:.4px}

/* Layout */
.dashboard-grid{display:grid;grid-template-columns:1fr;gap:18px}
.chart-box{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;display:flex;flex-direction:column;box-shadow:var(--sh);min-width:0}
.chart-title{font-size:13px;font-weight:800;color:#1e293b;text-transform:uppercase;letter-spacing:.4px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}

/* Gráfico de Barras */
.chart-bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:220px;padding:10px 4px 6px;background:repeating-linear-gradient(to top,transparent 0,transparent 25px,#f1f5f9 25px,#f1f5f9 26px);border-radius:8px;overflow-x:auto}
.c-bar-group{flex:1;display:flex;flex-direction:column;align-items:center;min-width:32px;max-width:60px;height:100%;justify-content:flex-end}
.c-bar{width:100%;border-radius:4px 4px 0 0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.1)}
.c-bar-val{font-size:10px;font-weight:800;margin-bottom:4px;color:#1e293b;text-align:center}
.c-bar-lbl{font-size:9px;font-weight:700;color:#475569;margin-top:6px;text-align:center;height:32px;overflow:hidden;width:100%;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* Tabela */
.table-container{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.table-header{background:#065f46;color:#fff;padding:12px 18px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd)}
th{background:#f8fafc;font-weight:800;color:#334155;font-size:11.5px;text-transform:uppercase}
tr:hover{background:#f8fafc}

.empty{text-align:center;color:var(--mu);padding:30px 10px;font-weight:600}
.hide{display:none}
.print-title-only { display: none; }

  * {-webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;}
