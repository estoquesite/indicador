<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Materiais não Estocáveis</title>

<style>
:root{--bg:#f0f0f0;--card:#fff;--tx:#1f2933;--mut:#6b7280;--bd:#d9dde1;--teal:#007e7a;--red:#c0305a;--blue:#1e90ff;--org:#e8703a;--navy:#1a2a9c;--side:#3bb3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1e242a;--tx:#e6e9ec;--mut:#9aa4ae;--bd:#333c45;--side:#0f5c80}}
:root[data-theme="dark"]{--bg:#14181c;--card:#1e242a;--tx:#e6e9ec;--mut:#9aa4ae;--bd:#333c45;--side:#0f5c80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--side)}
.header-left{display:flex;align-items:center;gap:12px;}
.home-btn{background:#fff;color:var(--teal);border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:13px}
h1{margin:0;font-size:22px;color:#fff}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.up{background:#fff;color:var(--teal);border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
.save-btn{background:#1a2a9c;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
#drop{margin:20px;padding:50px 20px;border:2px dashed var(--teal);border-radius:10px;text-align:center;color:var(--mut);background:var(--card)}
#drop.o{background:rgba(0,126,122,.1)}#drop b{display:block;font-size:18px;color:var(--teal);margin-bottom:6px}
main{padding:16px 20px;max-width:1500px;margin:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:6px;cursor:pointer}
.tabs button.a{background:var(--red);color:#fff;border-color:var(--red)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.fl label{font-size:11px;color:var(--mut);display:block}
.fl select,.fl input{width:100%;padding:6px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--tx)}
.kp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 18px;text-align:center;min-width:140px}
.k.r{background:var(--red);color:#fff;border-color:var(--red)}.k small{display:block;font-size:12px;opacity:.85}.k b{font-size:28px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;min-width:0}
.c h3{margin:0 0 8px;font-size:15px}
.bs{max-height:340px;overflow:auto}
.b{display:grid;grid-template-columns:110px 1fr 56px;gap:6px;align-items:center;margin:3px 0;font-size:12px}
.b span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b i{display:block;height:14px;border-radius:2px}.b em{font-style:normal;text-align:right;font-weight:700}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lg div{font-size:12px;margin:3px 0}.lg s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.tw{overflow-x:auto;max-height:480px;overflow-y:auto}
