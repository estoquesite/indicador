<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Biblioteca do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f0f0f0;--card:#fff;--tx:#1f2933;--mut:#6b7280;--bd:#d9dde1;--teal:#007e7a;--red:#c0305a;--blue:#1e90ff;--org:#e8703a;--navy:#1a2a9c;--side:#3bb3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1e242a;--tx:#e6e9ec;--mut:#9aa4ae;--bd:#333c45;--side:#0f5c80}}
:root[data-theme="dark"]{--bg:#14181c;--card:#1e242a;--tx:#e6e9ec;--mut:#9aa4ae;--bd:#333c45;--side:#0f5c80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--side)}
.header-left{display:flex;align-items:center;gap:12px;}
.home-btn{background:#fff;color:var(--teal);border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:13px}
h1{margin:0;font-size:22px;color:#fff}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.up{background:#fff;color:var(--teal);border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
.save-btn{background:#1a2a9c;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
#drop{margin:20px;padding:50px 20px;border:2px dashed var(--teal);border-radius:10px;text-align:center;color:var(--mut);background:var(--card)}
#drop.o{background:rgba(0,126,122,.1)}#drop b{display:block;font-size:18px;color:var(--teal);margin-bottom:6px}
main{padding:16px 20px;max-width:1500px;margin:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:6px;cursor:pointer}
.tabs button.a{background:var(--red);color:#fff;border-color:var(--red)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.fl label{font-size:11px;color:var(--mut);display:block}
.fl select,.fl input{width:100%;padding:6px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--tx)}
.kp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 18px;text-align:center;min-width:140px}
.k.r{background:var(--red);color:#fff;border-color:var(--red)}.k small{display:block;font-size:12px;opacity:.85}.k b{font-size:28px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;min-width:0}
.c h3{margin:0 0 8px;font-size:15px}
.bs{max-height:340px;overflow:auto}
.b{display:grid;grid-template-columns:110px 1fr 56px;gap:6px;align-items:center;margin:3px 0;font-size:12px}
.b span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b i{display:block;height:14px;border-radius:2px}.b em{font-style:normal;text-align:right;font-weight:700}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lg div{font-size:12px;margin:3px 0}.lg s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.tw{overflow-x:auto;max-height:480px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{position:sticky;top:0;background:var(--teal);color:#fff;padding:7px;text-align:left;cursor:pointer;white-space:nowrap}
td{padding:5px 7px;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:nth-child(even) td{background:rgba(128,128,128,.07)}
.n{color:var(--mut);font-size:12px;margin:6px 0}
</style></head><body>
<header>
<div class="header-left">
    <a href="index.html" class="home-btn" title="Voltar ao Painel Principal">🏠 Início</a>
    <h1>Gestão de Materiais não Estocáveis</h1>
</div>
<div class="header-right">
    <span id="fn" style="color:#fff;font-size:12px;margin-right:5px">Pronto para carregar</span>
    <!-- Botão de Upload Corrigido e Direto -->
    <label for="f" class="up" style="display:inline-block;cursor:pointer;margin:0;">Carregar arquivo mensal</label>
    <input id="f" type="file" accept=".xlsx,.xls,.csv" style="display:none">
    
    <button class="save-btn" onclick="salvarEstoqueSupabase()">Salvar na Nuvem</button>
</div>
</header>
<div id="drop"><b>Arraste o estoques.xlsx aqui</b>ou clique em "Carregar arquivo mensal" no topo. Você também pode sincronizar com o Supabase.</div>
<main id="app" hidden>
<div class="tabs" id="tabs"></div>
<div class="fl" id="fl"></div>
<div id="v"></div>
</main>
<script>
// --- CONFIGURAÇÃO DO SUPABASE ---
const SUPABASE_URL = 'SUA_URL_DO_SUPABASE'; // Substitua pela sua URL do Supabase
const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_PUBLICA'; // Substitua pela sua chave Anon/Public
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id),MS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CL=['1 - Até 2 meses','2 - De 2 a 6 meses','3 - De 6 meses a 1 ano','4 - Mais de 1 ano'],CC=['#1e90ff','#1a2a9c','#e8703a','#c0305a'];
let D=[],tab='pai',F={},sort={};
const nz=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');
const dt=v=>v instanceof Date&&!isNaN(v)?v:(typeof v==='string'&&v.trim()&&!isNaN(new Date(v))?new Date(v):null);
const num=v=>{v=parseFloat(v);return isNaN(v)?null:v};
const fd=d=>d?d.toLocaleDateString('pt-BR'):'';const fn=n=>Math.round(n).toLocaleString('pt-BR');
const dias=(a)=>Math.max(0,Math.floor((Date.now()-a)/864e5));

function processarDadosRows(rows, fileName){
  if(!rows.length){alert('Arquivo vazio');return}
  const map={};Object.keys(rows[0]).forEach(k=>map[nz(k)]=k);
  const g=(r,k)=>r[map[k]];
  D=rows.map(r=>{
   const desc=String(g(r,'descricaodoitem')||'').trim(),rec=dt(g(r,'datarec')),sa=dt(g(r,'datadesaida')),q=num(g(r,'quant'))||0,qs=num(g(r,'quantidadedesaida'));
   let sl=num(g(r,'saldoemestoque'));if(sl===null)sl=q-(qs||0);
   const last=sa||rec,d=last?dias(last):null;
   return{site:map.site?String(g(r,'site')||'SEM SITE').trim().toUpperCase():'CTSS',nf:String(g(r,'nf')||'').trim(),sol:String(g(r,'solicitante')||'').trim(),pr:dt(g(r,'prazoret')),dinv:dt(r.datadoinventario),emin:num(g(r,'estoqueminimo')),val:dt(r.datadevalidade),qr:qs||0,loc:String(g(r,'localizacao')||'—').trim().toUpperCase(),baia:String(g(r,'baiaarmazenamento')||'—').trim().toUpperCase(),ped:String(r.pedido||g(r,'pedido')||'').replace(/\.0$/,''),
    mat:String(g(r,'material')||'').replace(/\.0$/,''),desc,grp:(desc.split(/[\s;,]/)[0]||'—').toUpperCase(),q,um:g(r,'um')||'',rec,sa,qs:qs!==null?qs:(sl<=0?q:0),sl,d,
    cl:d===null?3:d<=60?0:d<=180?1:d<=365?2:3,dsto:rec&&sa?Math.max(0,Math.floor((sa-rec)/864e5)):''};
  });
  $('fn').textContent = fileName + ' • ' + D.length + ' linhas';$('drop').hidden = true;
  $('app').hidden = false;
  F={};
  render(true);
}

function load(file){
 const r=new FileReader();
 r.onload=e=>{
  const wb=XLSX.read(e.target.result,{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  processarDadosRows(rows, file.name);
 };
 r.readAsArrayBuffer(file);
}

$('f').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
const dz=$('drop');
dz.onclick=()=>$('f').click();
['dragover','dragenter'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('o')}));
dz.addEventListener('dragleave',()=>dz.classList.remove('o'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('o');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])});
document.body.addEventListener('dragover',e=>e.preventDefault());
document.body.addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])});

async function carregarEstoqueSupabase(){
    try {
        const { data, error } = await supabase.from('estoque').select('*');
        if (error || !data || !data.length) return;
        
        D = data.map(r=>{
           const desc=String(r.descricao||'').trim(),rec=dt(r.atualizado_em),sa=dt(r.datadesaida),q=num(r.quantidade)||0,qs=num(r.quantidadedesaida)||0;
           let sl=num(r.saldoemestoque);if(sl===null)sl=q-(qs||0);
           const last=sa||rec,d=last?dias(last):null;
           return{site:r.site?String(r.site||'SEM SITE').trim().toUpperCase():'CTSS',nf:String(r.nf||'').trim(),sol:String(r.solicitante||'').trim(),pr:dt(r.prazoret),dinv:dt(r.datadoinventario),emin:num(r.estoqueminimo),val:dt(r.datadevalidade),qr:qs||0,loc:String(r.loc||r.localizacao||'—').trim().toUpperCase(),baia:String(r.baia||r.baiaarmazenamento||'—').trim().toUpperCase(),ped:String(r.pedido||r.codigo_produto||'').replace(/\.0$/,''),
            mat:String(r.material||r.codigo_produto||'').replace(/\.0$/,''),desc,grp:(desc.split(/[\s;,]/)[0]||'—').toUpperCase(),q,um:r.um||'',rec,sa,qs:qs!==null?qs:(sl<=0?q:0),sl,d,
            cl:d===null?3:d<=60?0:d<=180?1:d<=365?2:3,dsto:rec&&sa?Math.max(0,Math.floor((sa-rec)/864e5)):''};
        });

        if(D.length > 0){
            $('fn').textContent = D.length + ' linhas (Supabase)';$('drop').hidden = true;
            $('app').hidden = false;
            F={};
            render(true);
        }
    } catch(err) {
        console.log('Supabase vazio ou offline.');
    }
}

async function salvarEstoqueSupabase(){
    if(!D.length){
        alert('Carregue um arquivo primeiro para poder salvar na nuvem.');
        return;
    }
    $('fn').textContent = 'Salvando...';
    try {
        const payload = D.map(r => ({
            codigo_produto: r.mat || r.ped || 'SEM_COD',
            descricao: r.desc,
            categoria: r.grp,
            quantidade: r.q,
            atualizado_em: new Date()
        }));

        const { error } = await supabase.from('estoque').upsert(payload, { onConflict: 'codigo_produto' });
        if(error) throw error;

        $('fn').textContent = D.length + ' linhas salvas no Supabase!';
        alert('Estoque salvo com sucesso na nuvem!');
    } catch(err) {
        alert('Erro ao salvar no Supabase: ' + err.message);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    carregarEstoqueSupabase();
});

const TABS={pai:'Painel',est:'Estoques',rot:'Rotatividade',zer:'Zerados',prz:'Prazo de retirada',inv:'Inventário',pen:'Pendências'};
function dateOf(r){return tab==='zer'?r.sa:r.rec}
function filt(){
 return D.filter(r=>{
  const z=r.sl<=0;if(tab==='zer'?!z:z&&tab!=='rot')return false;
  const d=dateOf(r);
  if(F.ano&&(!d||d.getFullYear()!=F.ano))return false;
  if(F.mes!==undefined&&F.mes!==''&&(!d||d.getMonth()!=F.mes))return false;
  if(F.site&&r.site!==F.site)return false;if(F.loc&&r.loc!==F.loc)return false;if(F.baia&&r.baia!==F.baia)return false;
  if(F.desc&&!r.desc.toLowerCase().includes(F.desc.toLowerCase()))return false;
  if(F.mat&&!r.mat.includes(F.mat))return false;if(F.ped&&!r.ped.includes(F.ped))return false;
  return true})}
function render(full){
 $('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'a':''}" onclick="tab='${k}';render(true)">${v}</button>`).join('');
 if(full){
  const anos=[...new Set(D.map(r=>dateOf(r)).filter(Boolean).map(d=>d.getFullYear()))].sort(),
   u=k=>[...new Set(D.map(r=>r[k]))].sort(),sel=(id,l,o)=>`<div><label>${l}</label><select id="${id}" onchange="sf('${id}',this.value)"><option value="">Todos</option>${o.map(x=>`<option value="${x[0]}" ${String(F[id])===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select></div>`,
   inp=(id,l)=>`<div><label>${l}</label><input id="${id}" value="${F[id]||''}" oninput="sf('${id}',this.value,1)"></div>`;
  $('fl').innerHTML=sel('site','Site',u('site').map(x=>[x,x]))+sel('ano','Ano ('+(tab==='zer'?'data de saída':'data de recebimento')+')',anos.map(a=>[a,a]))+sel('mes','Mês',MS.map((m,i)=>[i,m]))+sel('loc','Localização',u('loc').map(x=>[x,x]))+sel('baia','Baia de armazenamento',u('baia').map(x=>[x,x]))+inp('desc','Descrição do item')+`<div><label>Código (material)</label><input id="mat" list="dl" placeholder="digite ou escolha" value="${F.mat||''}" oninput="sf('mat',this.value,1)"><datalist id="dl">${u('mat').filter(Boolean).map(x=>`<option value="${x}">`).join('')}</datalist></div>`+inp('ped','Pedido');
 }
 const R=filt();$('v').innerHTML=({pai:vPai,est:vEst,rot:vRot,zer:vZer,prz:vPrz,inv:vInv,pen:vPen})[tab](R);
}
function sf(k,v,keep){F[k]=v;render(false)}
function agg(R,key,val){const m={};R.forEach(r=>{const k=key(r);if(k!==null)m[k]=(m[k]||0)+val(r)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(title,data,color,n=25){
 const mx=Math.max(1,...data.map(x=>x[1]));
 return`<div class="c"><h3>${title}</h3><div class="bs">${data.slice(0,n).map(([l,v])=>`<div class="b"><span title="${l}">${l}</span><span><i style="width:${v/mx*100}%;background:${color}"></i></span><em>${fn(v)}</em></div>`).join('')||'<div class="n">Sem dados</div>'}</div></div>`}
function months(R,val,date){const a=Array(12).fill(0);R.forEach(r=>{const d=date(r);if(d)a[d.getMonth()]+=val(r)});return MS.map((m,i)=>[m,a[i]])}
function donut(R){
 const c=[0,0,0,0];R.forEach(r=>c[r.cl]++);const t=c.reduce((a,b)=>a+b,0)||1;let o=0;
 const arcs=c.map((v,i)=>{const L=v/t*251.3,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${CC[i]}" stroke-width="22" stroke-dasharray="${L} 251.3" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=L;return s}).join('');
 return`<div class="c"><h3>Dias no estoque sem movimentação</h3><div class="dn"><svg width="170" height="170" viewBox="0 0 120 120">${arcs}</svg><div class="lg">${CL.map((l,i)=>`<div><s style="background:${CC[i]}"></s>${l}: <b>${c[i]}</b></div>`).join('')}</div></div></div>`}
function tbl(R,cols,id){
 const s=sort[tab];let rows=R.slice();
 if(s)rows.sort((a,b)=>{const x=cols[s.i][1](a),y=cols[s.i][1](b),xv=x instanceof Date?+x:x,yv=y instanceof Date?+y:y;return(xv>yv?1:xv<yv?-1:0)*s.d});
 return`<div class="c"><h3>Tabela status de material</h3><div class="tw"><table><tr>${cols.map((c,i)=>`<th onclick="srt(${i})">${c[0]}${s&&s.i===i?(s.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr>${rows.slice(0,300).map(r=>'<tr>'+cols.map(c=>{let v=c[1](r);if(v instanceof Date)v=fd(v);return`<td title="${v??''}">${v??''}</td>`}).join('')+'</tr>').join('')}</table></div><div class="n">Mostrando ${Math.min(300,R.length)} de ${R.length} linhas (use os filtros ou clique no cabeçalho para ordenar)</div></div>`}
function srt(i){const s=sort[tab];sort[tab]={i,d:s&&s.i===i?-s.d:1};render(false)}
const kp=(l,v,r)=>`<div class="k ${r?'r':''}"><small>${l}</small><b>${v}</b></div>`;
function vEst(R){
 const t=R.reduce((a,r)=>a+r.sl,0),old=R.filter(r=>r.cl===3).length;
 return`<div class="kp">${kp('Qtd. de itens',fn(R.length))}${kp('Total em unidades',fn(t),1)}${kp('Parados há +1 ano',fn(old))}</div>
 <div class="g">${bars('Estoque por grupo (unidades)',agg(R,r=>r.grp,r=>r.sl),'var(--org)')}${donut(R)}</div>
 ${tbl(R,[['Item',r=>r.grp],['Pedido',r=>r.ped],['Descrição',r=>r.desc],['Material',r=>r.mat],['Saldo',r=>r.sl],['Qtd. saída',r=>r.qs],['Data-Rec.',r=>r.rec],['Data saída',r=>r.sa],['Localização',r=>r.loc],['Baia',r=>r.baia],['Dias s/ mov.',r=>r.d],['Classificação',r=>CL[r.cl]]])}`}
function vRot(R0){
 const A=D.filter(r=>{const d=r.rec;return(!F.ano||d&&d.getFullYear()==F.ano)&&(F.mes===undefined||F.mes===''||d&&d.getMonth()==F.mes)&&(!F.site||r.site===F.site)&&(!F.loc||r.loc===F.loc)&&(!F.baia||r.baia===F.baia)&&(!F.desc||r.desc.toLowerCase().includes(F.desc.toLowerCase()))&&(!F.mat||r.mat.includes(F.mat))&&(!F.ped||r.ped.includes(F.ped))});
 const rec=A.reduce((a,r)=>a+r.q,0),sai=A.reduce((a,r)=>a+r.qs,0),sem=A.filter(r=>r.sl>0&&!r.sa).length;
 const g={};A.forEach(r=>{const o=g[r.grp]||(g[r.grp]={q:0,qs:0,sl:0});o.q+=r.q;o.qs+=r.qs;o.sl+=r.sl});
 const L=Object.entries(g).map(([k,o])=>({k,...o,giro:o.q?o.qs/o.q*100:0})).sort((a,b)=>b.qs-a.qs);
 return`<div class="kp">${kp('Recebido (un.)',fn(rec))}${kp('Saída (un.)',fn(sai))}${kp('Giro (saída/recebido)',(rc?sai/rec*100:0).toFixed(1)+'%',1)}${kp('Itens sem nenhuma saída',fn(sem))}</div>
 <div class="g">${bars('Saída por mês (unidades)',months(A,r=>r.qs,r=>r.sa),'var(--blue)',12)}${bars('Top grupos por saída (unidades)',L.map(x=>[x.k,x.qs]),'var(--teal)')}</div>
 ${tbl(L,[['Grupo',r=>r.k],['Recebido',r=>r.q],['Saída',r=>r.qs],['Saldo',r=>r.sl],['Giro %',r=>+r.giro.toFixed(1)]])}`}
function vZer(R){
 return`<div class="kp">${kp('Itens zerados no estoque',fn(R.length),1)}${kp('Total saído (un.)',fn(R.reduce((a,r)=>a+r.qs,0)))}</div>
 <div class="g">${bars('Saída dos materiais zerados por grupo',agg(R,r=>r.grp,r=>r.qs),'var(--red)')}${bars('Saída dos materiais zerados por mês',months(R,r=>r.qs,r=>r.sa),'var(--blue)',12)}</div>
 ${tbl(R,[['Galpão',r=>r.loc],['Material',r=>r.mat],['Descrição',r=>r.desc],['Data-Rec.',r=>r.rec],['Data de saída',r=>r.sa],['Dias no estoque',r=>r.dsto],['Última mov. (dias)',r=>r.sa?dias(r.sa):r.d],['Saldo',r=>r.sl],['Qtd. saída',r=>r.qs]])}`}
const CF={},ven=r=>r.pr&&r.pr<Date.now()?dias(r.pr):0,IC=['Sem inventário','Até 6 meses','De 6 meses a 1 ano','Mais de 1 ano'],ic=r=>!r.dinv?0:(d=>d<=180?1:d<=365?2:3)(dias(r.dinv)),
PEN=[['Código de material inválido',r=>['','0','1','-'].includes(r.mat)],['Sem nota fiscal',r=>!r.nf],['Sem pedido',r=>!r.ped],['Sem solicitante',r=>!r.sol],['Sem baia',r=>r.baia==='—'],['Saldo ≠ quant. − saída',r=>Math.abs(r.q-r.qr-r.sl)>.001],['Recebimento com data futura',r=>r.rec&&r.rec>Date.now()]];
const pn=R=>{R.forEach(r=>r.pn=PEN.filter(p=>p[1](r)).map(p=>p[0]));return R};
function cf(i,v){(CF[tab]=CF[tab]||{})[i]=v;render(false);const e=$('cf'+i);e.focus();e.setSelectionRange(v.length,v.length)}
function tbl(R,cols){
